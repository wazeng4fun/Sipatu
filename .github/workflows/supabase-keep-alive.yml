name: Supabase Keep Alive (Anti-Sleep)

on:
  schedule:
    # Berjalan secara otomatis setiap hari pada pukul 00:00 UTC (pukul 07:00 WIB)
    # Anda juga bisa mengubah jadwalnya sesuai kebutuhan
    - cron: '0 0 * * *'
  workflow_dispatch: # Mengizinkan Anda untuk menjalankan ping secara manual dari GitHub

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Kirim Sinyal Ping ke Supabase API
        run: |
          curl -i -X GET "https://iryyiynuerthbasjduii.supabase.co/rest/v1/pengaturan?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_xvkk4sUb0Oc10YqX1vnuDQ_OWCxh75a' }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_xvkk4sUb0Oc10YqX1vnuDQ_OWCxh75a' }}"
