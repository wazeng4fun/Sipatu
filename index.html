<head>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .glass-card { background: white; border-radius: 1.25rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); border: 1px solid #e2e8f0; transition: all 0.3s ease; }
        .status-badge-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .dot-pending { background-color: #3b82f6; box-shadow: 0 0 0 4px #eff6ff; }
        .dot-approved { background-color: #22c55e; box-shadow: 0 0 0 4px #f0fdf4; }
        .dot-rejected { background-color: #ef4444; box-shadow: 0 0 0 4px #fef2f2; }
        #nameDropdown::-webkit-scrollbar { width: 6px; }
        #nameDropdown::-webkit-scrollbar-track { background: #f1f5f9; }
        #nameDropdown::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">

                    <div class="flex flex-wrap items-center gap-2 mt-1">

    <!-- Modal ID Pengajuan -->
    <div id="redirectModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[200] hidden items-center justify-center p-4">

            <div id="copySuccess" class="hidden text-emerald-600 text-xs font-bold mb-4"><i class="fas fa-check-circle"></i> ID Berhasil disalin!</div>
            <button id="btnGoToForm" disabled onclick="redirectToForm()" class="w-full bg-slate-200 text-slate-400 font-bold py-4 rounded-xl flex items-center justify-center gap-2 transition-all">Selesai <i class="fas fa-check"></i></button>
        </div>

    <script>
        // ==========================================
        // KONFIGURASI APPWRITE TERINTEGRASI (REAL)
        // ==========================================
        const APPWRITE_ENDPOINT = 'https://cloud.appwrite.io/v1';
        const APPWRITE_PROJECT = '6a22a17c000781c6f640';       // Project ID Anda
        const APPWRITE_DATABASE = '6a22a383001fc5099c0e';     // Database ID Anda
        const APPWRITE_COLLECTION = 'pengajuancuti';           // Collection ID Anda

        const { Client, Databases, ID, Query } = window.Appwrite;
        const client = new Client().setEndpoint(APPWRITE_ENDPOINT).setProject(APPWRITE_PROJECT);
        const databases = new Databases(client);

        // Data Pegawai (Menggunakan Google Sheet Publik yang ringan)
        const CSV_PEGAWAI = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSSiqcVdHShSAnCXEBQOB4MUNdOYU2yKWWa5m5YuOcPXVo3b967XtQZGjVd3PMkQW_PWKWrVnfllC59/pub?gid=940631284&single=true&output=csv";
        
        const REPORT_PIN_HASH = "U2lwYXR1OTU="; // PIN "Sipatu95"

        let pegawaiList = [], allHistory = [], filtered = [];
        let datePicker, currentSubmissionId = "";
        let currentPage = 1;
        const rowsPerPage = 5;
        let isAdminActive = false;
        let isCloudConnected = false;

        // MANAJEMEN TAHUN AJARAN AKTIF DI CLIENT-SIDE
        let activeTahunAjaran = localStorage.getItem('SIPATU_TA_AKTIF') || "2023-2024";

        document.addEventListener('click', function(e) {
            const container = document.getElementById('nameContainer');
            const dropdown = document.getElementById('nameDropdown');
            if (container && !container.contains(e.target)) {
                dropdown.classList.add('hidden');
            }
        });

        // Regex Parser CSV yang kuat untuk menghandle koma dalam tanda kutip (Gelar Pendidikan)
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result;
        }

        function parseCustomDate(dateStr) {
            if (!dateStr || dateStr === "-") return null;
            if (dateStr instanceof Date) return dateStr;
            if (typeof dateStr === 'string' && dateStr.includes('T')) {
                const parsedDate = new Date(dateStr);
                if (!isNaN(parsedDate.getTime())) return parsedDate;
            }
            if (typeof dateStr === 'string' && dateStr.includes('/')) {
                const parts = dateStr.split(' ')[0].split('/');
                if (parts.length === 3) {
                    if (parts[0].length === 4) return new Date(parts[0], parts[1] - 1, parts[2]);
                    else return new Date(parts[2], parts[1] - 1, parts[0]);
                }
            }
            const d = new Date(dateStr);
            return isNaN(d.getTime()) ? null : d;
        }

        function humanizeDate(di) {
            const d = parseCustomDate(di);
            if (!d) return "-";
            return d.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }

        function humanizeRange(rs) {
            if (!rs || rs === "-") return "-";
            return rs.split(',').map(dStr => {
                const d = parseCustomDate(dStr.trim());
                if (!d) return dStr;
                return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
            }).join(', ');
        }

        async function init() {
            document.getElementById('lblTahunAjaran').innerText = `(${activeTahunAjaran})`;
            datePicker = flatpickr("#tglCuti", { mode: "multiple", dateFormat: "d/m/Y", minDate: "today" });
            document.getElementById('todayDateLabel').innerText = humanizeDate(new Date());
            
            await fetchEmployees(); 
            await fetchHistory(); 
            setupPinListener();
        }

        async function fetchEmployees() {
            try {
                const res = await fetch(CSV_PEGAWAI);
                const text = await res.text();
                pegawaiList = text.split('\n').slice(1).map(row => {
                    const c = parseCSVLine(row);
                    return { 
                        nama: c[0]?.replace(/"/g, '').trim(), 
                        jabatan: c[1]?.replace(/"/g, '').trim() 
                    };
                }).filter(p => p.nama);
            } catch (e) { console.error(e); }
        }

        // FUNGSI BACKUP & FALLBACK DATABASE LOKAL
        function getLocalStorageHistory() {
            try {
                return JSON.parse(localStorage.getItem('SIPATU_LOCAL_DATABASE') || '[]');
            } catch (e) {
                return [];
            }
        }

        function saveLocalStorageHistory(data) {
            try {
                localStorage.setItem('SIPATU_LOCAL_DATABASE', JSON.stringify(data));
            } catch (e) {
                console.error("Gagal menulis ke localStorage:", e);
            }
        }

        function updateSyncStatus(connected) {
            isCloudConnected = connected;
            const indicator = document.getElementById('syncIndicator');
            if (connected) {
                indicator.className = "inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9px] font-bold bg-emerald-50 text-emerald-600 border border-emerald-100";
                indicator.innerHTML = `<i class="fas fa-cloud text-[8px]"></i> Terhubung ke Cloud`;
            } else {
                indicator.className = "inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9px] font-bold bg-amber-50 text-amber-600 border border-amber-100 animate-pulse";
                indicator.innerHTML = `<i class="fas fa-hdd text-[8px]"></i> Mode Database Lokal`;
            }
        }

        async function fetchHistory() {
            try {
                // Mengambil dari Database Appwrite secara realtime
                const response = await databases.listDocuments(
                    APPWRITE_DATABASE,
                    APPWRITE_COLLECTION,
                    [
                        Query.limit(500)
                    ]
                );
                
                // Jika sukses, sinkronisasikan cache lokal
                saveLocalStorageHistory(response.documents);
                updateSyncStatus(true);
                processRawData(response.documents);
            } catch (e) { 
                console.warn("Gagal terhubung ke Appwrite (Menggunakan fallback lokal):", e); 
                updateSyncStatus(false);
                // Fallback ke penyimpanan offline localStorage
                const offlineData = getLocalStorageHistory();
                processRawData(offlineData);
            }
        }

        function processRawData(documents) {
            // Filter berdasarkan Tahun Ajaran Aktif dan urutkan tanggal terbaru
            let rawData = documents.filter(doc => doc.tahun_ajaran === activeTahunAjaran);
            rawData.sort((a, b) => new Date(b.tgl_pengajuan || b.$createdAt) - new Date(a.tgl_pengajuan || a.$createdAt));

            allHistory = rawData.map(i => {
                const rawPeriode = String(i.periodecuti || "-");
                const tglAju = i.tgl_pengajuan || i.$createdAt || new Date().toISOString();
                const parsedAju = parseCustomDate(tglAju);
                
                return { 
                    ...i, 
                    appwriteId: i.$id || i.id, // Simpan ID Internal Appwrite atau ID lokal
                    displayPeriode: humanizeRange(rawPeriode), 
                    totalHari: rawPeriode.split(',').filter(d => d.trim()).length, 
                    tglPengajuanHuman: humanizeDate(tglAju),
                    rawTglPengajuan: parsedAju,
                    rawPeriodeList: rawPeriode.split(',').map(d => d.trim())
                };
            });
            
            filtered = [...allHistory];
            render();
            renderMonitorCuti();
            if (isAdminActive) updateAdminStats();
        }

        function render() {
            const tbody = document.getElementById('historyBody');
            const startIndex = (currentPage - 1) * rowsPerPage;
            const pageItems = filtered.slice(startIndex, startIndex + rowsPerPage);
            const actionHeader = document.getElementById('actionHeader');

            if (isAdminActive) {
                actionHeader.innerText = "Konfirmasi & Preview";
                actionHeader.className = "px-6 py-4 text-[10px] font-extrabold text-slate-400 uppercase text-center w-40";
            } else {
                actionHeader.innerText = "Aksi";
                actionHeader.className = "px-6 py-4 text-[10px] font-extrabold text-slate-400 uppercase text-center";
            }

            tbody.innerHTML = pageItems.map(i => {
                const status = (i.status || 'pending').toLowerCase();
                let dotClass = "dot-pending";
                if(status === "approved" || status === "disetujui") dotClass = "dot-approved";
                if(status === "rejected" || status === "ditolak") dotClass = "dot-rejected";

                let actionButtons = "";
                if (isAdminActive) {
                    actionButtons = `
                        <div class="flex items-center justify-center gap-1.5">
                            <button onclick="updateLeaveStatus('${i.id}', 'Approved')" title="Setujui Pengajuan" class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-emerald-50 text-emerald-600 hover:bg-emerald-600 hover:text-white transition-all">

        function renderMonitorCuti() {
            const tbody = document.getElementById('upcomingBody');
            const today = new Date();
            const day = today.getDate().toString().padStart(2, '0');
            const month = (today.getMonth()+1).toString().padStart(2, '0');
            const todayKey = `${day}/${month}/${today.getFullYear()}`;
            
            const listHariIni = [];

            allHistory.forEach(item => {
                const s = (item.status || "").toLowerCase();
                const isApproved = s === "approved" || s === "disetujui";
                const isPending = s === "pending" || s === "" || !s;
                const isCutiTahunan = item.jeniscuti === "Cuti Tahunan";
                const isCutiMendadak = item.jeniscuti === "Cuti Mendadak";

                const allowedStatus = (isCutiTahunan && isApproved) || (isCutiMendadak && (isApproved || isPending));

                if (allowedStatus) {
                    if (item.rawPeriodeList.includes(todayKey)) {
                        listHariIni.push(item);
                    }
                }
            });

            if (listHariIni.length === 0) {
                tbody.innerHTML = `<tr><td class="px-6 py-12 text-center text-slate-400 flex flex-col items-center gap-2">
                    <i class="fas fa-user-check text-2xl text-slate-200"></i>
                    <p class="text-[11px] font-bold uppercase tracking-widest">Semua Staff Hadir Hari Ini</p>
                </td></tr>`;
                return;
            }

            tbody.innerHTML = listHariIni.map(it => {
                const s = (it.status || 'pending').toLowerCase();
                const isPending = s === "pending" || s === "" || !s;
                const isApproved = s === "approved" || s === "disetujui";
                
                return `<tr class="hover:bg-slate-50 border-b border-slate-50 transition-all">
                    <td class="px-6 py-4">
                        <div class="flex items-center justify-between">
                            <div class="flex flex-col">
                                <div class="font-bold text-slate-800 text-sm">${it.nama}</div>
                                <div class="text-[9px] font-bold text-slate-400 uppercase tracking-tight">${it.jabatan}</div>
                            </div>
                            <div class="flex flex-col items-end gap-1">
                                <span class="px-2 py-0.5 ${it.jeniscuti === 'Cuti Mendadak' ? 'bg-amber-50 text-amber-600 border-amber-100' : 'bg-indigo-50 text-indigo-600 border-indigo-100'} rounded text-[9px] font-bold uppercase border">
                                    ${it.jeniscuti}
                                </span>
                                ${isPending ? '<span class="text-[8px] font-black text-blue-500 uppercase tracking-tighter bg-blue-50 px-1 rounded">MENUNGGU</span>' : ''}
                                ${isApproved ? '<span class="text-[8px] font-black text-emerald-500 uppercase tracking-tighter bg-emerald-50 px-1 rounded">DISETUJUI</span>' : ''}
                            </div>
                        </div>
                    </td>
                </tr>`;
            }).join('');
        }

        async function updateLeaveStatus(id, newStatus) {
            const leave = allHistory.find(item => item.id === id);
            if (!leave) return;

            // Optimistic UI Update (Berubah sebelum API selesai)
            leave.status = newStatus;
            showNotification('Memproses', `Memperbarui status...`, 'info');
            render();
            renderMonitorCuti();

            try {
                if (isCloudConnected) {
                    // UPDATE KE APPWRITE DATABASE
                    await databases.updateDocument(
                        APPWRITE_DATABASE, 
                        APPWRITE_COLLECTION, 
                        leave.appwriteId, 
                        { status: newStatus }
                    );
                    showNotification('Sukses', `Status berhasil diubah menjadi ${newStatus}!`, 'success');
                } else {
                    // Simpan di Database lokal
                    const localData = getLocalStorageHistory();
                    const index = localData.findIndex(doc => doc.id === id);
                    if (index !== -1) {
                        localData[index].status = newStatus;
                        saveLocalStorageHistory(localData);
                    }
                    showNotification('Sukses (Offline)', `Status diubah secara lokal menjadi ${newStatus}!`, 'success');
                }
                updateAdminStats();
            } catch (e) {
                showNotification('Gagal', 'Terjadi kesalahan saat memperbarui status.', 'error');
                fetchHistory(); // Ambil ulang data jika gagal
            }
        }

        async function handleSubmit(event) {
            event.preventDefault();
            const btn = document.getElementById('submit-btn'); btn.disabled = true; btn.innerHTML = `Mengirim...`;
            currentSubmissionId = "RQ-" + Math.random().toString(36).substring(2, 7).toUpperCase();
            
            const payload = { 
                id: currentSubmissionId, 
                nama: document.getElementById('namaInput').value, 
                jabatan: document.getElementById('jabatan').value, 
                jeniscuti: document.getElementById('jenis').value, 
                periodecuti: document.getElementById('tglCuti').value, 
                alasancuti: document.getElementById('alasan').value || "-",
                tgl_pengajuan: new Date().toISOString(),
                status: "Pending",
                tahun_ajaran: activeTahunAjaran
            };
            
            try {
                if (isCloudConnected) {
                    // POST CREATE KE APPWRITE DATABASE
                    await databases.createDocument(
                        APPWRITE_DATABASE,
                        APPWRITE_COLLECTION,
                        ID.unique(),
                        payload
                    );
                    showNotification('Sukses', 'Pengajuan Cuti Berhasil Terkirim ke Cloud!', 'success');
                } else {
                    // Simpan ke offline fallback
                    const localData = getLocalStorageHistory();
                    localData.push({ ...payload, $id: 'local_' + currentSubmissionId });
                    saveLocalStorageHistory(localData);
                    showNotification('Sukses (Offline)', 'Pengajuan tersimpan di database lokal!', 'success');
                }

                if (payload.jeniscuti === "Cuti Mendadak") {
                    showRedirectModal(); 
                }
                document.getElementById('cutiForm').reset(); 
                setTimeout(fetchHistory, 1000); 
            } catch (e) { 
                // Jika Appwrite tiba-tiba gagal sewaktu-waktu
                console.error(e);
                const localData = getLocalStorageHistory();
                localData.push({ ...payload, $id: 'local_' + currentSubmissionId });
                saveLocalStorageHistory(localData);
                showNotification('Sukses (Offline Fallback)', 'Koneksi cloud terganggu. Pengajuan disimpan secara lokal.', 'warning');
                if (payload.jeniscuti === "Cuti Mendadak") {
                    showRedirectModal(); 
                }
                document.getElementById('cutiForm').reset();
                setTimeout(fetchHistory, 1000);
            } finally { 
                btn.disabled = false; btn.innerHTML = `Kirim Pengajuan`; 
            }
        }

            let yPos = 55;

            yPos += 12;

            const values = [`: ${data.nama}`, `: ${data.jabatan}`, `: ${data.jeniscuti}`, `: ${data.displayPeriode}`, `: ${data.totalHari} Hari`, `: `];

            labels.forEach((l, i) => {

            });

            yPos += 5;

            doc.setTextColor(stampColor[0], stampColor[1], stampColor[2]); doc.setFontSize(24); doc.setFont("helvetica", "bold");
            doc.text(stampMain, 105, yPos + 15, { align: "center" });
            doc.setFontSize(9); doc.setFont("helvetica", "italic"); doc.text(stampSub, 105, yPos + 22, { align: "center" });

            doc.setLineWidth(0.1); doc.setDrawColor(226, 232, 240); doc.setFillColor(248, 250, 252);
            doc.roundedRect(boxX, boxY, boxW, boxH, 2, 2, 'FD');
            doc.setFontSize(8); doc.setFont("helvetica", "bold"); doc.text("VERIFIKASI DIGITAL", boxX + (boxW/2), boxY + 7, { align: "center" });
            doc.setFont("helvetica", "normal"); doc.setFontSize(7); doc.text(`Diajukan: ${data.tglPengajuanHuman}`, boxX + 5, boxY + 15);
            doc.text(`Sistem: SIPATU-SMART`, boxX + 5, boxY + 20);
            
            // Konversi UTF-8 yang aman sebelum btoa() untuk menghindari crash akibat nama khusus
            const secureString = unescape(encodeURIComponent(data.id + data.nama));
            const code = btoa(secureString).substring(0, 16).toUpperCase();

                const fileName = `${data.nama} - ${data.id}.pdf`.replace(/[/\\?%*:|"<>]/g, '-');
                doc.save(fileName);
            }
        }

        function generatePeriodicPDF() {
            const startStr = document.getElementById('reportStart').value;
            const endStr = document.getElementById('reportEnd').value;
            if (!startStr || !endStr) { 
                showNotification('Peringatan', 'Pilih rentang tanggal terlebih dahulu!', 'warning');
                return; 
            }

            const startDate = new Date(startStr); startDate.setHours(0, 0, 0, 0);
            const endDate = new Date(endStr); endDate.setHours(23, 59, 59, 999);

            const filteredData = allHistory.filter(item => {
                const itemDate = item.rawTglPengajuan;
                return itemDate && itemDate >= startDate && itemDate <= endDate;
            });

            if (filteredData.length === 0) { 
                showNotification('Info', 'Data transaksi tidak ditemukan pada rentang tanggal tersebut!', 'warning');
                return; 
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');

            doc.setFont("helvetica", "bold"); doc.setFontSize(16);
            doc.text("REKAPAN CUTI", 105, 20, { align: "center" });
            doc.setFontSize(10); doc.setFont("helvetica", "normal");
            doc.text(`Periode: ${startDate.toLocaleDateString('id-ID')} s/d ${endDate.toLocaleDateString('id-ID')}`, 105, 26, { align: "center" });

            const sortedPegawai = [...pegawaiList].sort((a, b) => a.jabatan.localeCompare(b.jabatan));
            const rekapRows = sortedPegawai.map((pegawai, index) => {
                const cutis = filteredData.filter(h => 
                    h.nama.trim().toLowerCase() === pegawai.nama.trim().toLowerCase() && 
                    (h.status?.toLowerCase() === 'approved' || h.status?.toLowerCase() === 'disetujui')
                );
                let t = 0, m = 0;
                cutis.forEach(c => {
                    if (c.jeniscuti === "Cuti Tahunan") t += c.totalHari;
                    else if (c.jeniscuti === "Cuti Mendadak") m += c.totalHari;
                });
                return [index + 1, pegawai.nama, pegawai.jabatan, t > 0 ? `${t} Hari` : "-", m > 0 ? `${m} Hari` : "-"];
            });

            doc.autoTable({
                head: [['No', 'Nama Pegawai', 'Jabatan', 'Cuti Tahunan', 'Cuti Mendadak']],
                body: rekapRows, startY: 35, theme: 'grid',
                headStyles: { fillColor: [79, 70, 229], textColor: 255 },
                styles: { fontSize: 8 }
            });

            doc.addPage();
            doc.setFont("helvetica", "bold"); doc.setFontSize(14); doc.text("DETAIL TRANSAKSI", 105, 20, { align: "center" });
            const detailRows = filteredData.map((item, index) => [
                index + 1, item.id, item.nama, item.jeniscuti, item.displayPeriode, item.totalHari, (item.status || 'PENDING').toUpperCase()
            ]);
            doc.autoTable({
                head: [['No', 'ID', 'Nama', 'Kategori', 'Tanggal', 'Hari', 'Status']],
                body: detailRows, startY: 30, theme: 'striped',
                headStyles: { fillColor: [51, 65, 85] },
                styles: { fontSize: 7 }
            });

            doc.save(`Laporan_SIPATU_${startStr}.pdf`);
            closeReportModal();
        }

                            <input type="text" id="newSheetName" value="${activeTahunAjaran}" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs outline-none focus:border-indigo-500 font-bold">
                            <button onclick="setActiveYear()" class="bg-indigo-600 text-white px-3 py-2 rounded-lg text-[10px] font-bold hover:bg-indigo-700 transition-all whitespace-nowrap">
                                Aktifkan
                            </button>
                        </div>
                        <p class="text-[9px] text-slate-500 mt-2">*Merubah ini akan memfilter seluruh data cuti sesuai tag Tahun Ajaran.</p>
                    </div>
                </div>
            `;
            updateAdminStats();
        }

        function updateAdminStats() {
            const statPending = document.getElementById('statPending');
            const statApproved = document.getElementById('statApproved');
            const statRejected = document.getElementById('statRejected');
            const statTotal = document.getElementById('statTotal');

            if (!statPending || !statApproved || !statRejected || !statTotal) return;

            let pending = 0, approved = 0, rejected = 0;

            allHistory.forEach(item => {
                const s = (item.status || 'pending').toLowerCase();
                if (s === 'pending' || s === '') pending++;
                else if (s === 'approved' || s === 'disetujui') approved++;
                else if (s === 'rejected' || s === 'ditolak') rejected++;
            });

            statPending.innerText = pending;
            statApproved.innerText = approved;
            statRejected.innerText = rejected;
            statTotal.innerText = allHistory.length;
        }

        function nextPage() { if(currentPage < Math.ceil(filtered.length / rowsPerPage)) { currentPage++; render(); } }
        function prevPage() { if(currentPage > 1) { currentPage--; render(); } }
        function handleSearch() { 
            const t = document.getElementById('search').value.toLowerCase(); 
            filtered = allHistory.filter(i => (i.nama || "").toLowerCase().includes(t) || (i.id || "").toLowerCase().includes(t)); 
            currentPage = 1; render(); 
        }

        // Mengganti parameter flatpickr secara dinamis tanpa menghancurkan objek flatpickr DOM
        function handleTypeChange() { 
            const j = document.getElementById('jenis').value; 
            const a = document.getElementById('alasan-area'); 
            if (j === "Cuti Mendadak") { 
                a.classList.remove('hidden'); 
                datePicker.set('minDate', new Date().fp_incr(-14)); 
            } else { 
                a.classList.add('hidden'); 
                datePicker.set('minDate', 'today'); 
            } 
        }

        function showNotification(title, message, type) {
            const existToast = document.getElementById('customToast');
            if (existToast) existToast.remove();
            const toast = document.createElement('div');
            toast.id = 'customToast';
            let bgClass = "bg-indigo-100 border-indigo-500 text-indigo-700";
            if (type === 'success') bgClass = "bg-emerald-100 border-emerald-500 text-emerald-700";
            if (type === 'error') bgClass = "bg-rose-100 border-rose-500 text-rose-700";
            if (type === 'warning') bgClass = "bg-amber-100 border-amber-500 text-amber-700";
            toast.className = `fixed bottom-5 right-5 ${bgClass} border-l-4 p-4 rounded-xl shadow-lg z-[250] transition-all duration-300 max-w-sm`;
            toast.innerHTML = `<p class="font-bold">${title}</p><p class="text-xs mt-1">${message}</p>`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        function setupPinListener() {
            document.getElementById('reportPin').addEventListener('input', (e) => {
                const fs = document.getElementById('filter-section');
                const err = document.getElementById('pin-error');
                const encodedInput = btoa(unescape(encodeURIComponent(e.target.value)));
                if (encodedInput === REPORT_PIN_HASH) {
                    fs.classList.remove('opacity-30', 'pointer-events-none');
                    err.classList.add('hidden');
                } else {
                    fs.classList.add('opacity-30', 'pointer-events-none');
                    if (e.target.value.length >= 8) err.classList.remove('hidden');
                    else err.classList.add('hidden');
                }
            });
        }

        function openReportModal() { document.getElementById('reportModal').style.display = 'flex'; }
        function closeReportModal() { document.getElementById('reportModal').style.display = 'none'; }
        function closeAdminPinModal() { document.getElementById('adminPinModal').style.display = 'none'; }
        function showDropdown() { document.getElementById('nameDropdown').classList.remove('hidden'); filterDropdown(); }
        
        function filterDropdown() { 
            const v = document.getElementById('namaInput').value.toLowerCase(); 
            const it = pegawaiList.filter(p => p.nama.toLowerCase().includes(v)); 
            document.getElementById('nameDropdown').innerHTML = it.map(p => `<div onclick="selectP('${p.nama.replace(/'/g, "\\'")}', '${p.jabatan.replace(/'/g, "\\'")}')" class="px-4 py-3 hover:bg-indigo-50 cursor-pointer text-sm font-medium border-b border-slate-50 last:border-0"><div>${p.nama}</div><div class="text-[9px] text-slate-400 font-bold uppercase">${p.jabatan}</div></div>`).join(''); 
        }

        function selectP(n, j) { document.getElementById('namaInput').value = n; document.getElementById('jabatan').value = j; document.getElementById('nameDropdown').classList.add('hidden'); }
        function showRedirectModal() { document.getElementById('displayId').innerText = currentSubmissionId; document.getElementById('redirectModal').style.display = 'flex'; }
        
        function copySubmissionId() {
            const el = document.createElement('textarea'); 
            el.value = currentSubmissionId; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
            document.getElementById('copySuccess').classList.remove('hidden'); document.getElementById('btnGoToForm').disabled = false;
            document.getElementById('btnGoToForm').className = "w-full bg-indigo-600 text-white font-bold py-4 rounded-xl flex items-center justify-center gap-2 cursor-pointer";
        }

        function redirectToForm() { document.getElementById('redirectModal').style.display = 'none'; }
        
        window.onload = init;
    </script>
</body>
</html>
